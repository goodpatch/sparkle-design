packages: []
minimumReleaseAge: 2880
# Security patch 適用のため公開直後でもインストールを許可するパッケージ。
# en: Packages whose security-patched releases we allow to install before the
#     minimumReleaseAge window elapses.
minimumReleaseAgeExclude:
  - hono
  - yaml
  - '@eslint/plugin-kit'
  - brace-expansion
onlyBuiltDependencies:
  - '@bundled-es-modules/glob'
  - '@tailwindcss/oxide'
  - esbuild
  - msw
  - sharp
  - style-dictionary
  - unrs-resolver
overrides:
  lodash: ^4.17.23
  path-to-regexp: ^8.4.0
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  picomatch: ^4.0.4
  flatted: ^3.4.2
  undici: ^6.24.0
  tar: ^7.5.11
  minimatch@>=7.0.0 <7.4.8: ^7.4.8
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  minimatch@>=10.0.0 <10.2.3: ^10.2.3
  minimatch@<3.1.3: ^3.1.3
  ajv@<6.14.0: ^6.14.0
  qs@<6.14.2: ^6.14.2
  '@modelcontextprotocol/sdk': ^1.26.0
  '@isaacs/brace-expansion': ^5.0.1
  diff@>=5.0.0 <5.2.2: ^5.2.2
  body-parser@>=2.2.0 <2.2.1: ^2.2.1
  glob@>=10.2.0 <10.5.0: ^10.5.0
  glob@>=11.0.0 <11.1.0: ^11.1.0
  js-yaml@>=4.0.0 <4.1.1: ^4.1.1
  playwright: ^1.59.1
  form-data: ^4.0.4
  hono: ^4.12.18
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  '@eslint/plugin-kit': ^0.3.4
  brace-expansion@<1.1.13: ^1.1.13
