name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Dist-tag を選択。auto は package.json の version から自動判定 (X.Y.Z-beta.N → beta / X.Y.Z-rc.N → next / X.Y.Z → latest)。"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - latest
          - next
          - beta

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # git tag の push と `gh release create` に contents: write が必要。
      # 従来は手動タグ付け運用だったが、v1.0.6 で GitHub Release 作成が漏れたため
      # 自動化する（sparkle-design-cli / sparkle-design-internal の publish.yml と同じ対応）。
      # en: `contents: write` is required to push the release tag and create the
      # GitHub Release. Manual tagging was missed for v1.0.6, so this mirrors
      # sparkle-design-cli / sparkle-design-internal's automation.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:package

      - name: Determine dist-tag
        id: tag
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")

          # pre-release の命名ルール（sparkle-design-cli の publish.yml と同じ）:
          #   - `-beta.N`  → beta dist-tag
          #   - `-rc.N`    → next dist-tag
          #   - それ以外 (-alpha.N 等) は未対応として exit 1
          # 素の `npm publish` だと prerelease でも latest に載ってしまうため、
          # 必ず --tag を明示する。
          # en: Same naming rule as sparkle-design-cli. Always pass --tag so a
          # prerelease never lands on `latest`.
          case "$VERSION" in
            *-beta.*) AUTO="beta" ;;
            *-rc.*)   AUTO="next" ;;
            *-*)      AUTO="unsupported" ;;
            *)        AUTO="latest" ;;
          esac

          if [ "$INPUT_CHANNEL" = "auto" ]; then
            CHANNEL="$AUTO"
          else
            CHANNEL="$INPUT_CHANNEL"
          fi

          if [ "$CHANNEL" = "unsupported" ]; then
            echo "::error::未対応の prerelease version です: $VERSION (サポートは -beta.N / -rc.N のみ)"
            exit 1
          fi

          case "$CHANNEL:$VERSION" in
            latest:*-*)
              echo "::error::prerelease version ($VERSION) は latest へ publish できません"
              exit 1
              ;;
            beta:*-*) ;;
            beta:*)
              echo "::error::安定版 ($VERSION) は beta へ publish できません。-beta.N を付けてください"
              exit 1
              ;;
            next:*-*) ;;
            next:*)
              echo "::error::安定版 ($VERSION) は next へ publish できません。-rc.N を付けてください"
              exit 1
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "→ $VERSION を --tag $CHANNEL で publish します"

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ steps.tag.outputs.channel }}
        run: npm publish --tag "$PUBLISH_TAG"

      - name: Tag commit and create GitHub Release
        # npm publish が成功した直後に同じ commit に `vX.Y.Z` tag を打ち、
        # CHANGELOG.md の `## [X.Y.Z]` セクションを release notes として
        # GitHub Release を自動作成する。手動 tag 漏れを防ぐための後段処理。
        # en: Tag the commit and create a matching GitHub Release after a
        # successful npm publish, using the CHANGELOG section as notes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists locally — skipping git tag push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists — leaving notes untouched"
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          node scripts/extract-changelog-section.mjs "${VERSION}" > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            # CHANGELOG に該当セクションが無いとき。release は作るが
            # 内容は fallback note にして、抜け漏れを後で人間が拾えるよう
            # warn を出す。
            # en: No CHANGELOG entry — emit a fallback note and warn so a
            # follow-up PR can fix CHANGELOG without blocking publish.
            echo "::warning::CHANGELOG.md に [${VERSION}] セクションが見つかりません。fallback note で release を作成します。"
            printf 'Release %s\n\nCHANGELOG.md にこのバージョン用のセクションがありません。後追いで CHANGELOG を更新してから本 release notes も編集してください。\n' "${VERSION}" > "${NOTES_FILE}"
          fi

          # `-` を含むバージョン (X.Y.Z-rc.N / X.Y.Z-beta.N) は GitHub 上で
          # pre-release マークを付ける。
          # en: Mark pre-release for any version containing a `-` (rc / beta).
          PRERELEASE_FLAG=""
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            ${PRERELEASE_FLAG}

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### Published"
            echo ""
            echo "- package: \`sparkle-design\`"
            echo "- version: \`$VERSION\`"
            echo "- dist-tag: \`${{ steps.tag.outputs.channel }}\`"
            echo "- GitHub Release: [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"
